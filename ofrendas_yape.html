<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#71009b">
<title>Ofrendas</title>
<style>
:root{--p:#71009b;--p2:#4e006d;--a:#19c7b5;--ink:#24152c;--muted:#82748a;--line:#eee5f2;--bg:#faf8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.top{height:5px;background:linear-gradient(90deg,var(--a) 0 25%,var(--p) 25%)}main{width:min(880px,92%);margin:0 auto;padding:28px 0 44px}.recipient{text-align:center;color:var(--p);font-size:14px;font-weight:800;letter-spacing:.2px;margin:18px 0 8px}.yape-logo{background:var(--p);color:white;border-radius:15px;padding:8px 15px;font-weight:900;font-size:24px;font-style:italic;letter-spacing:-1px}.yape-logo span{font-size:12px;font-style:normal;background:var(--a);color:#143b40;border-radius:50%;padding:3px 5px;margin-right:4px}.verse{text-align:center;max-width:520px;margin:-12px auto 24px;color:#6e5a76;font-size:13px;line-height:1.5}.verse span{display:block;margin-top:4px;font-size:11px;font-weight:700;color:var(--p)}h1{text-align:center;font-size:clamp(30px,5vw,40px);letter-spacing:-1.4px;margin:0 0 22px;color:var(--p)}.layout{display:grid;grid-template-columns:1fr;gap:16px;align-items:start;max-width:620px;margin:0 auto}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,26px);box-shadow:0 12px 35px #3a16440a}h2{font-size:16px;margin:0 0 16px;letter-spacing:-.3px}.field{margin:0 0 17px}.field label{display:block;font-size:12px;font-weight:750;margin:0 0 7px}.field input,.field textarea{width:100%;border:1px solid #e6dce9;border-radius:11px;padding:12px 13px;font:inherit;font-size:14px;outline:none;background:#fff}.field input:focus,.field textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #71009b12}.field textarea{min-height:75px;resize:vertical}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.type{padding:12px;border:1px solid var(--line);border-radius:11px;background:white;font:inherit;font-size:13px;font-weight:700;text-align:left;cursor:pointer}.type.active{border-color:var(--p);color:var(--p);background:#fbf4ff}.hide{display:none}.amount-note{font-size:11px;color:var(--muted);margin:7px 1px 0}.primary,.wa{width:100%;display:flex;justify-content:center;align-items:center;gap:9px;border:0;border-radius:12px;padding:14px 15px;font:inherit;font-weight:750;font-size:14px;text-decoration:none;cursor:pointer}.primary{background:var(--p);color:white;margin-top:4px}.wa{background:#13bda9;color:#073f3b;margin-top:10px}.payment{text-align:center}.qr-bottom{margin-top:0}.yape-app{width:100%;display:flex;justify-content:center;align-items:center;gap:9px;border:1px solid var(--p);border-radius:12px;padding:13px 15px;font:inherit;font-weight:750;font-size:14px;text-decoration:none;cursor:pointer;color:var(--p);background:white;margin-top:10px}.qr{width:min(100%,340px);height:auto;display:block;margin:2px auto 14px;border-radius:12px}.payee{font-size:17px;font-weight:800;margin:0 0 4px}.phone{font-size:21px;font-weight:850;letter-spacing:.6px;margin:0 0 15px}.small{font-size:11px;color:var(--muted);line-height:1.5;margin:0}.notice{display:none;border-radius:10px;background:#f3e8fa;color:var(--p2);padding:11px;margin-top:12px;font-size:12px;line-height:1.5}.notice.show{display:block}.footer{text-align:center;font-size:11px;color:var(--muted);padding:0 16px 25px}@media(max-width:680px){main{padding-top:12px}.qr{max-width:250px}.card{border-radius:17px}}
</style></head>
<body><div class="top"></div><main>
<h1>Ofrendas</h1>
<p class="verse">“Derramaré sobre ustedes bendición hasta que sobreabunde.” <span>— Malaquías 3:10</span></p>
<div class="layout">
<section class="card"><h2>Tu ofrenda</h2>
<form id="form">
<div class="field"><label for="name">Nombres</label><input id="name" name="name" placeholder="Escribe tu nombre" maxlength="100" required></div>
<div class="field"><label for="ministry">Ministerio</label><input id="ministry" name="ministry" placeholder="Escribe tu ministerio" maxlength="100" required></div>
<div class="field"><label>Tipo de ofrenda</label><div class="types">
<button class="type" type="button" data-type="Diezmo">Diezmo</button><button class="type active" type="button" data-type="Ofrenda">Ofrenda</button><button class="type" type="button" data-type="Pacto">Pacto</button><button class="type" type="button" data-type="Otros">Otros</button>
</div></div>
<div class="field hide" id="otherField"><label for="otherReason">Motivo de la ofrenda</label><textarea id="otherReason" placeholder="Escribe el motivo"></textarea></div>
<div class="field"><label for="amount">Importe (S/)</label><input id="amount" name="amount" type="number" min="0.1" max="100000" step="0.01" inputmode="decimal" placeholder="Ejemplo: 5 soles" required><p class="amount-note">Ejemplo: 5 soles. El importe es voluntario.</p></div>
<button class="primary" type="submit"><svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M20.52 3.48A11.82 11.82 0 0 0 12.1 0C5.53 0 .18 5.35.18 11.92c0 2.1.55 4.16 1.6 5.97L.08 24l6.27-1.64a11.9 11.9 0 0 0 5.75 1.47h.01c6.57 0 11.92-5.35 11.92-11.92a11.83 11.83 0 0 0-3.51-8.43ZM12.1 21.8a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.72.97.99-3.63-.23-.37a9.86 9.86 0 0 1-1.52-5.26c0-5.47 4.45-9.92 9.93-9.92a9.85 9.85 0 0 1 7.02 2.91 9.85 9.85 0 0 1 2.9 7.02c0 5.47-4.45 9.92-9.93 9.92Z"/></svg><span>Enviar por WhatsApp</span></button>
<div class="notice" id="notice" role="status"></div>
</form></section>
</section>

const otherField=document.getElementById('otherField');

 buttons.forEach(x=>x.classList.toggle('active',x===b));

 window.open('https://wa.me/51936086264?text='+encodeURIComponent(lines.join('\n')),'_blank','noopener');
});
