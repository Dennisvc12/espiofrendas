<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#71009b">
<title>Ofrendas</title>
<style>
:root{--p:#71009b;--p2:#4e006d;--a:#19c7b5;--ink:#24152c;--muted:#82748a;--line:#eee5f2;--bg:#faf8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.top{height:5px;background:linear-gradient(90deg,var(--a) 0 25%,var(--p) 25%)}main{width:min(880px,92%);margin:0 auto;padding:28px 0 44px}.brand{display:flex;justify-content:center;align-items:center;margin:4px 0 26px}.yape-logo{background:var(--p);color:white;border-radius:15px;padding:8px 15px;font-weight:900;font-size:24px;font-style:italic;letter-spacing:-1px}.yape-logo span{font-size:12px;font-style:normal;background:var(--a);color:#143b40;border-radius:50%;padding:3px 5px;margin-right:4px}h1{text-align:center;font-size:clamp(32px,6vw,46px);letter-spacing:-1.8px;margin:0 0 28px;color:var(--p)}.layout{display:grid;grid-template-columns:1fr .85fr;gap:20px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,26px);box-shadow:0 12px 35px #3a16440a}h2{font-size:17px;margin:0 0 20px;letter-spacing:-.3px}.field{margin:0 0 17px}.field label{display:block;font-size:12px;font-weight:750;margin:0 0 7px}.field input,.field textarea{width:100%;border:1px solid #e6dce9;border-radius:11px;padding:12px 13px;font:inherit;font-size:14px;outline:none;background:#fff}.field input:focus,.field textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #71009b12}.field textarea{min-height:75px;resize:vertical}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.type{padding:12px;border:1px solid var(--line);border-radius:11px;background:white;font:inherit;font-size:13px;font-weight:700;text-align:left;cursor:pointer}.type.active{border-color:var(--p);color:var(--p);background:#fbf4ff}.hide{display:none}.amount-note{font-size:11px;color:var(--muted);margin:7px 1px 0}.primary,.wa{width:100%;display:flex;justify-content:center;align-items:center;gap:9px;border:0;border-radius:12px;padding:14px 15px;font:inherit;font-weight:750;font-size:14px;text-decoration:none;cursor:pointer}.primary{background:var(--p);color:white;margin-top:4px}.wa{background:#13bda9;color:#073f3b;margin-top:10px}.payment{text-align:center}.qr{width:min(100%,300px);height:auto;display:block;margin:2px auto 14px;border-radius:12px}.payee{font-size:17px;font-weight:800;margin:0 0 4px}.phone{font-size:21px;font-weight:850;letter-spacing:.6px;margin:0 0 15px}.small{font-size:11px;color:var(--muted);line-height:1.5;margin:0}.notice{display:none;border-radius:10px;background:#f3e8fa;color:var(--p2);padding:11px;margin-top:12px;font-size:12px;line-height:1.5}.notice.show{display:block}.footer{text-align:center;font-size:11px;color:var(--muted);padding:0 16px 25px}@media(max-width:680px){main{padding-top:20px}.layout{grid-template-columns:1fr}.payment{order:-1}.qr{max-width:250px}.card{border-radius:17px}}
</style></head>
<body><div class="top"></div><main>
<div class="brand"><div class="yape-logo"><span>S/</span> yape</div></div>
<h1>Ofrendas</h1>
<div class="layout">
<section class="card"><h2>Tu ofrenda</h2>
<form id="form">
<div class="field"><label for="name">Nombres</label><input id="name" name="name" placeholder="Escribe tu nombre" maxlength="100" required></div>
<div class="field"><label for="ministry">Ministerio</label><input id="ministry" name="ministry" placeholder="Escribe tu ministerio" maxlength="100" required></div>
<div class="field"><label>Tipo de ofrenda</label><div class="types">
<button class="type" type="button" data-type="Diezmo">Diezmo</button><button class="type active" type="button" data-type="Ofrenda">Ofrenda</button><button class="type" type="button" data-type="Pacto">Pacto</button><button class="type" type="button" data-type="Otros">Otros</button>
</div></div>
<div class="field hide" id="otherField"><label for="otherReason">Motivo de la ofrenda</label><textarea id="otherReason" placeholder="Escribe el motivo"></textarea></div>
<div class="field"><label for="amount">Importe (S/)</label><input id="amount" name="amount" type="number" min="0.1" max="100000" step="0.01" inputmode="decimal" placeholder="Ejemplo: 5 soles" required><p class="amount-note">Ejemplo: 5 soles. El importe es voluntario.</p></div>
<button class="primary" type="submit">Preparar mensaje <span aria-hidden="true">→</span></button>
<div class="notice" id="notice" role="status"></div>
</form></section>
